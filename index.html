<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Signup</title>
  <!-- Inline favicon to prevent /favicon.ico 404 requests -->
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%2016%2016'><rect fill='%236a11cb' width='16' height='16'/><text x='8' y='11' font-size='10' text-anchor='middle' fill='%23fff' font-family='sans-serif'>L</text></svg>">
  <style>
    /* General Page Styling */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
    }

    .container {
      width: 380px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .tabs {
      display: flex;
    }

    .tabs button {
      flex: 1;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      outline: none;
      cursor: pointer;
      background: #eee;
      transition: 0.3s;
    }

    .tabs button.active {
      background: #6a11cb;
      color: white;
    }

    .form {
      padding: 25px;
      display: none;
    }

    .form.active {
      display: block;
      animation: fadeIn 0.5s ease-in-out;
    }

    .form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #6a11cb;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      font-size: 14px;
      font-weight: 500;
      display: block;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #6a11cb;
      box-shadow: 0 0 8px rgba(106, 17, 203, 0.4);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .extra {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .extra a {
      color: #6a11cb;
      text-decoration: none;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-div {
      background-color: hsl(327, 90%, 20%);
      color: white;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.5s ease-in-out;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-target="login" onclick="showForm(event,'login')">Login</button>
      <button class="tab-btn" data-target="signup" onclick="showForm(event,'signup')">Signup</button>
    </div>
<!-- Login Form -->
<div class="form active" id="login">
  <h2>Login</h2>
  <div id="signinmessage" class="message-div"></div>
  <form id="loginForm" method="post" action="">
    <div class="input-group">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="Enter your email">
    </div>
    <div class="input-group">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password">
    </div>
    <button type="submit" class="btn">Login</button>
  </form>

  <!-- ✅ Forgot Password link add kiya -->
  <div class="extra">
    <p><a href="#" onclick="showForm(event,'forgot')">Forgot Password?</a></p>
  </div>
</div>

<!-- Forgot Password Form (NEW) -->
<div class="form" id="forgot">
  <h2>Reset Password</h2>
  <div id="forgotmessage" class="message-div"></div>
  <form id="forgotForm" method="post" action="">
    <div class="input-group">
      <label for="forgotEmail">Enter your email</label>
      <input type="email" id="forgotEmail" placeholder="Enter your registered email">
    </div>
    <button type="submit" class="btn">Send Reset Link</button>
  </form>
  <div class="extra">
    <p>Back to <a href="#" onclick="showForm(event,'login')">Login</a></p>
  </div>
</div>

<!-- Minimal Signup Form (so the Signup tab works) -->
<div class="form" id="signup">
  <h2>Signup</h2>
  <div id="signupmessage" class="message-div"></div>
  <form id="signupForm" method="post" action="">
    <div class="input-group">
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" placeholder="Enter your email">
    </div>
    <div class="input-group">
      <label for="signupPassword">Password</label>
      <input type="password" id="signupPassword" placeholder="Enter a password">
    </div>
    <div class="input-group">
      <label for="signupPassword2">Confirm Password</label>
      <input type="password" id="signupPassword2" placeholder="Confirm password">
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>
  <div class="extra">
    <p>Already have an account? <a href="#" onclick="showForm(event,'login')">Login</a></p>
  </div>
</div>

  <script>
    // improved showForm: accepts the click event and a target form id,
    // prevents default for links, safely toggles active classes
    function showForm(e, formId) {
      if (e && e.preventDefault) e.preventDefault();
      // hide all forms
      document.querySelectorAll(".form").forEach(f => f.classList.remove("active"));
      // activate requested form only if it exists
      const target = document.getElementById(formId);
      if (target) target.classList.add("active");
      // set tab button active state based on data-target
      document.querySelectorAll(".tab-btn").forEach(b => {
        if (b.dataset && b.dataset.target === formId) b.classList.add("active");
        else b.classList.remove("active");
      });
    }

    // small helpers for message display
    function showMessage(el, text, timeout = 4000) {
      el.textContent = text;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, timeout);
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Auth handlers are implemented in `firebase.js` module.
    // Keep only the UI helpers in this file. The module will attach
    // the real submit handlers to the forms.
  </script>
  <script type="module" src="firebase.js"></script>
</body>
</html>
</html>
